name: Update prices
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 週一至週五 UTC 21:30（美股收盤後）
  workflow_dispatch:          # 可在 Actions 頁面手動執行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python fetch_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "update prices $(date -u +%F)"
          git push
